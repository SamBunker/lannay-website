<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero A — Name as Second Big Moment</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: #0b1a30;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(
      180deg,
      #0b1a30 0%,
      #0d2444 20%,
      #0c3a5e 42%,
      #1a5a7a 58%,
      #2e7a8a 70%,
      #c47830 85%,
      #e8923a 95%,
      #f0a040 100%
    );
  }

  /* Sun */
  .sun {
    position: absolute;
    left: 60%;
    bottom: 9%;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,230,160,.95) 0%, rgba(255,180,60,.8) 30%, rgba(241,119,32,.4) 55%, transparent 70%);
    transform: translateX(-50%);
  }
  .sun::after {
    content: '';
    position: absolute;
    inset: -90px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,180,60,.25) 0%, rgba(241,119,32,.1) 40%, transparent 65%);
  }

  /* Waves */
  .waves {
    position: absolute;
    bottom: -2px;
    left: 0; right: 0;
    height: 120px;
    pointer-events: none;
    z-index: 2;
  }
  .wave {
    position: absolute;
    bottom: 0; left: 0;
    width: 120%; height: 100%;
    animation: wave1 8s ease-in-out infinite alternate;
  }
  .wave2 { animation: wave2 6s ease-in-out infinite alternate; }

  @keyframes wave1 {
    from { transform: translateX(0); }
    to   { transform: translateX(-10%); }
  }
  @keyframes wave2 {
    from { transform: translateX(-10%); }
    to   { transform: translateX(0); }
  }

  /* Content */
  .content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 6rem 2rem 8rem;
    gap: 0;
  }

  /* Logo placeholder */
  .logo-wrap {
    margin-bottom: 2.5rem;
    animation: fadeUp 0.9s 0.3s ease both;
  }
  .logo-text {
    font-family: 'Georgia', serif;
    font-size: clamp(4rem, 14vw, 10rem);
    font-weight: 400;
    font-style: italic;
    color: #fff;
    letter-spacing: -0.02em;
    line-height: 1;
    text-shadow: 0 0 60px rgba(255,200,120,.45);
  }
  .logo-dotcom {
    font-size: clamp(1rem, 2vw, 1.6rem);
    font-weight: 300;
    font-style: italic;
    color: #f1771f;
    vertical-align: super;
    letter-spacing: 0.05em;
  }

  /* Divider */
  .divider {
    width: 60px;
    height: 1px;
    background: rgba(255,255,255,.2);
    margin: 0 auto 2rem;
    animation: fadeUp 0.7s 0.7s ease both;
  }

  /* Name — the second big moment */
  .name {
    font-family: 'Georgia', serif;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    font-weight: 700;
    font-style: normal;
    color: #fff;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1.1rem;
    animation: fadeUp 0.7s 0.9s ease both;
  }

  /* Punchy tagline */
  .tagline {
    font-family: 'Georgia', serif;
    font-size: clamp(1rem, 2.2vw, 1.25rem);
    font-weight: 300;
    font-style: italic;
    color: rgba(255,255,255,.65);
    margin-bottom: 2.5rem;
    letter-spacing: 0.03em;
    animation: fadeUp 0.7s 1.1s ease both;
  }

  /* CTAs */
  .actions {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 0.7s 1.3s ease both;
  }
  .btn {
    display: inline-block;
    padding: 0.85rem 2.5rem;
    border-radius: 50px;
    font-family: 'Arial', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary {
    background: #00a7e1;
    color: #0b1a30;
    border: 2px solid #00a7e1;
    box-shadow: 0 4px 18px rgba(0,167,225,.35);
  }
  .btn-primary:hover { box-shadow: 0 8px 28px rgba(0,167,225,.55); }
  .btn-secondary {
    background: #f1771f;
    color: #0b1a30;
    border: 2px solid #f1771f;
    box-shadow: 0 4px 18px rgba(241,119,32,.35);
  }
  .btn-secondary:hover { box-shadow: 0 8px 28px rgba(241,119,32,.55); }

  /* Scroll cue */
  .scroll-cue {
    position: absolute;
    bottom: 2.2rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,195,100,.5);
    animation: bob 2s ease-in-out 2s infinite both;
  }
  .scroll-cue svg { width: 22px; height: auto; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes bob {
    0%,100% { transform: translateX(-50%) translateY(0); opacity:.5; }
    50%      { transform: translateX(-50%) translateY(7px); opacity:.8; }
  }

  /* Label */
  .mock-label {
    position: fixed;
    top: 1rem; left: 1rem;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-family: monospace;
    font-size: 0.75rem;
    padding: 0.35rem 0.75rem;
    border-radius: 4px;
    z-index: 999;
    backdrop-filter: blur(6px);
  }
</style>
</head>
<body>
<div class="mock-label">Option A — Name as Second Big Moment</div>

<section class="hero">
  <div class="sun"></div>

  <div class="waves">
    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,60 C360,120 720,0 1080,60 C1260,90 1380,50 1440,60 L1440,120 L0,120 Z" fill="rgba(4,116,186,0.3)"/>
    </svg>
    <svg class="wave wave2" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,80 C240,20 480,100 720,60 C960,20 1200,100 1440,80 L1440,120 L0,120 Z" fill="rgba(0,167,225,0.2)"/>
    </svg>
  </div>

  <div class="content">
    <div class="logo-wrap">
      <span class="logo-text">Lannay<span class="logo-dotcom">.com</span></span>
    </div>

    <div class="divider"></div>

    <h1 class="name">Chloe Webb</h1>

    <p class="tagline">Strategy &amp; Design that actually sticks.</p>

    <div class="actions">
      <a href="#" class="btn btn-primary">View My Work</a>
      <a href="#" class="btn btn-secondary">Get In Touch</a>
    </div>
  </div>

  <div class="scroll-cue">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 5v14M5 12l7 7 7-7"/>
    </svg>
  </div>
</section>
</body>
</html>
