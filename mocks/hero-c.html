<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero C — Cinematic Minimalism</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: #0b1a30;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(
      180deg,
      #0b1a30 0%,
      #0d2444 20%,
      #0c3a5e 42%,
      #1a5a7a 58%,
      #2e7a8a 70%,
      #c47830 85%,
      #e8923a 95%,
      #f0a040 100%
    );
  }

  /* Richer atmospheric sky layers */
  .sky-layer {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 62% 72%, rgba(255,160,50,.18) 0%, transparent 60%);
    pointer-events: none;
  }

  .sun {
    position: absolute;
    left: 62%;
    bottom: 10%;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,240,180,1) 0%, rgba(255,190,70,.9) 25%, rgba(241,119,32,.5) 50%, transparent 68%);
    transform: translateX(-50%);
    box-shadow: 0 0 80px 30px rgba(255,170,60,.2);
  }
  .sun::after {
    content: '';
    position: absolute;
    inset: -110px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,180,60,.2) 0%, rgba(241,119,32,.07) 40%, transparent 62%);
  }

  /* Light rays */
  .rays {
    position: absolute;
    left: 62%;
    bottom: 10%;
    width: 600px;
    height: 600px;
    transform: translate(-50%, 50%);
    pointer-events: none;
    opacity: 0.07;
    background: repeating-conic-gradient(
      rgba(255,200,80,1) 0deg 3deg,
      transparent 3deg 18deg
    );
    border-radius: 50%;
    animation: ray-spin 40s linear infinite;
  }
  @keyframes ray-spin { to { transform: translate(-50%, 50%) rotate(360deg); } }

  /* Sun reflection on water */
  .reflection {
    position: absolute;
    bottom: 0;
    left: 47%;
    transform: translateX(-50%);
    width: 180px;
    height: 90px;
    background: linear-gradient(180deg, rgba(255,200,100,.22) 0%, transparent 100%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
  }

  .waves {
    position: absolute;
    bottom: -2px;
    left: 0; right: 0;
    height: 120px;
    pointer-events: none;
    z-index: 2;
  }
  .wave {
    position: absolute;
    bottom: 0; left: 0;
    width: 120%; height: 100%;
    animation: wave1 8s ease-in-out infinite alternate;
  }
  .wave2 { animation: wave2 6s ease-in-out infinite alternate; }
  @keyframes wave1 { from { transform: translateX(0); } to { transform: translateX(-10%); } }
  @keyframes wave2 { from { transform: translateX(-10%); } to { transform: translateX(0); } }

  /* Content — left-aligned for cinematic feel */
  .content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    padding: 0 6vw;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }

  /* Eyebrow */
  .eyebrow {
    font-family: 'Arial', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #00a7e1;
    margin-bottom: 1.5rem;
    animation: fadeLeft 0.7s 0.3s ease both;
  }

  /* Logo — dominant */
  .logo-text {
    font-family: 'Georgia', serif;
    font-size: clamp(5rem, 15vw, 12rem);
    font-weight: 400;
    font-style: italic;
    color: #fff;
    letter-spacing: -0.03em;
    line-height: 0.9;
    text-shadow: 0 0 80px rgba(255,200,120,.5);
    margin-bottom: 0.15em;
    animation: fadeLeft 1s 0.5s cubic-bezier(0.25, 0.1, 0.3, 1) both;
  }
  .logo-dotcom {
    font-size: 0.22em;
    font-weight: 300;
    font-style: italic;
    color: #f1771f;
    vertical-align: super;
    letter-spacing: 0.05em;
  }

  /* Name — tight under the logo */
  .name-row {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 2.5rem;
    animation: fadeLeft 0.7s 1.1s ease both;
  }
  .name-line {
    width: 50px;
    height: 1px;
    background: rgba(255,255,255,.25);
    flex-shrink: 0;
  }
  .name-text {
    font-family: 'Arial', sans-serif;
    font-size: clamp(0.85rem, 1.6vw, 1rem);
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
  }

  /* Role descriptor */
  .role {
    font-family: 'Georgia', serif;
    font-size: clamp(1rem, 2vw, 1.3rem);
    font-weight: 300;
    font-style: italic;
    color: rgba(255,255,255,.6);
    margin-bottom: 2.75rem;
    animation: fadeLeft 0.7s 1.3s ease both;
  }

  .actions {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    animation: fadeLeft 0.7s 1.5s ease both;
  }
  .btn {
    display: inline-block;
    padding: 0.85rem 2.5rem;
    border-radius: 50px;
    font-family: 'Arial', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary {
    background: #00a7e1;
    color: #0b1a30;
    border: 2px solid #00a7e1;
    box-shadow: 0 4px 18px rgba(0,167,225,.35);
  }
  .btn-primary:hover { box-shadow: 0 8px 28px rgba(0,167,225,.55); }
  .btn-secondary {
    background: transparent;
    color: rgba(255,255,255,.75);
    border: 2px solid rgba(255,255,255,.25);
  }
  .btn-secondary:hover { border-color: rgba(255,255,255,.55); color: #fff; }

  .scroll-cue {
    position: absolute;
    bottom: 2.2rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,195,100,.5);
    animation: bob 2s ease-in-out 2s infinite both;
  }
  .scroll-cue svg { width: 22px; height: auto; }

  @keyframes fadeLeft {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes bob {
    0%,100% { transform: translateX(-50%) translateY(0); opacity:.5; }
    50%      { transform: translateX(-50%) translateY(7px); opacity:.8; }
  }

  .mock-label {
    position: fixed;
    top: 1rem; left: 1rem;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-family: monospace;
    font-size: 0.75rem;
    padding: 0.35rem 0.75rem;
    border-radius: 4px;
    z-index: 999;
    backdrop-filter: blur(6px);
  }
</style>
</head>
<body>
<div class="mock-label">Option C — Cinematic Minimalism (Left-Aligned)</div>

<section class="hero">
  <div class="sky-layer"></div>
  <div class="rays"></div>
  <div class="sun"></div>
  <div class="reflection"></div>

  <div class="waves">
    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,60 C360,120 720,0 1080,60 C1260,90 1380,50 1440,60 L1440,120 L0,120 Z" fill="rgba(4,116,186,0.3)"/>
    </svg>
    <svg class="wave wave2" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,80 C240,20 480,100 720,60 C960,20 1200,100 1440,80 L1440,120 L0,120 Z" fill="rgba(0,167,225,0.2)"/>
    </svg>
  </div>

  <div class="content">
    <span class="eyebrow">Brand Strategy &amp; Design</span>

    <div class="logo-text">Lannay<span class="logo-dotcom">.com</span></div>

    <div class="name-row">
      <span class="name-line"></span>
      <span class="name-text">Chloe Webb</span>
    </div>

    <p class="role">Helping ideas find their voice.</p>

    <div class="actions">
      <a href="#" class="btn btn-primary">View My Work</a>
      <a href="#" class="btn btn-secondary">Get In Touch</a>
    </div>
  </div>

  <div class="scroll-cue">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 5v14M5 12l7 7 7-7"/>
    </svg>
  </div>
</section>
</body>
</html>
