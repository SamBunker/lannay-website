<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Identity 1 — Frosted Card</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #0b1a30; }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(180deg,#0b1a30 0%,#0d2444 20%,#0c3a5e 42%,#1a5a7a 58%,#2e7a8a 70%,#c47830 85%,#e8923a 95%,#f0a040 100%);
  }
  .sun {
    position: absolute; left: 60%; bottom: 9%;
    width: 130px; height: 130px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,230,160,.95) 0%, rgba(255,180,60,.8) 30%, rgba(241,119,32,.4) 55%, transparent 70%);
    transform: translateX(-50%);
  }
  .sun::after {
    content: ''; position: absolute; inset: -90px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,180,60,.25) 0%, rgba(241,119,32,.1) 40%, transparent 65%);
  }
  .waves { position: absolute; bottom: -2px; left: 0; right: 0; height: 120px; pointer-events: none; z-index: 2; }
  .wave { position: absolute; bottom: 0; left: 0; width: 120%; height: 100%; animation: wave1 8s ease-in-out infinite alternate; }
  .wave2 { animation: wave2 6s ease-in-out infinite alternate; }
  @keyframes wave1 { from { transform: translateX(0); } to { transform: translateX(-10%); } }
  @keyframes wave2 { from { transform: translateX(-10%); } to { transform: translateX(0); } }

  .content {
    position: relative; z-index: 3;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 6rem 2rem 8rem;
    max-width: 900px; width: 100%; margin: 0 auto; gap: 2.5rem;
  }

  /* Statement */
  .statement {
    font-family: 'Georgia', serif;
    font-size: clamp(2.6rem, 7.5vw, 6rem);
    font-weight: 700; font-style: italic;
    color: #fff; line-height: 1.1; letter-spacing: -0.02em;
  }
  .statement .char {
    display: inline-block; opacity: 0;
    animation: charPark 0.22s ease-out both;
  }
  .statement .char.space { width: 0.28em; }
  .statement .char.accent { color: #f1771f; }
  @keyframes charPark {
    0%   { opacity: 0;  transform: translateY(-40px) rotate(-25deg) scale(1.3); }
    60%  { opacity: 1;  transform: translateY(5px) rotate(4deg) scale(0.97); }
    80%  { transform: translateY(-3px) rotate(-1deg) scale(1.01); }
    100% { opacity: 1;  transform: translateY(0) rotate(0deg) scale(1); }
  }

  /* ── STYLE 1: Frosted card ── */
  .card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 2rem 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 0;
    animation: fadeUp 0.6s 0.55s ease both;
    min-width: 280px;
  }

  .card-name {
    font-family: 'Georgia', serif;
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .card-divider {
    width: 40px; height: 1px;
    background: rgba(255,255,255,.2);
    margin: 0.4rem 0;
  }

  .card-logo {
    font-family: 'Georgia', serif;
    font-size: clamp(1rem, 2vw, 1.35rem);
    font-weight: 400; font-style: italic;
    color: rgba(255,255,255,.8);
    letter-spacing: -0.01em;
  }
  .card-logo span { color: #f1771f; font-size: 0.8em; vertical-align: super; }

  .card-role {
    font-family: 'Arial', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #f1771f;
    margin-top: 0.25rem;
  }

  /* Buttons below card */
  .actions {
    display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
    opacity: 0;
    animation: fadeUp 0.6s 0.85s ease both;
  }
  .btn {
    display: inline-block; padding: 0.85rem 2.5rem; border-radius: 50px;
    font-family: 'Arial', sans-serif; font-size: 0.9rem; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase; text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: #00a7e1; color: #0b1a30; border: 2px solid #00a7e1; }
  .btn-primary:hover { box-shadow: 0 8px 28px rgba(0,167,225,.55); }
  .btn-secondary { background: #f1771f; color: #0b1a30; border: 2px solid #f1771f; }
  .btn-secondary:hover { box-shadow: 0 8px 28px rgba(241,119,32,.55); }

  .scroll-cue {
    position: absolute; bottom: 2.2rem; left: 50%; transform: translateX(-50%);
    color: rgba(255,195,100,.5); animation: bob 2s ease-in-out 2s infinite both;
  }
  .scroll-cue svg { width: 22px; height: auto; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bob {
    0%,100% { transform: translateX(-50%) translateY(0); opacity:.5; }
    50%      { transform: translateX(-50%) translateY(7px); opacity:.8; }
  }

  .mock-label {
    position: fixed; top: 1rem; left: 1rem;
    background: rgba(0,0,0,.55); color: #fff; font-family: monospace;
    font-size: 0.75rem; padding: 0.35rem 0.75rem; border-radius: 4px;
    z-index: 999; backdrop-filter: blur(6px);
  }
</style>
</head>
<body>
<div class="mock-label">Style 1 — Frosted Card</div>
<section class="hero">
  <div class="sun"></div>
  <div class="waves">
    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,60 C360,120 720,0 1080,60 C1260,90 1380,50 1440,60 L1440,120 L0,120 Z" fill="rgba(4,116,186,0.3)"/></svg>
    <svg class="wave wave2" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,80 C240,20 480,100 720,60 C960,20 1200,100 1440,80 L1440,120 L0,120 Z" fill="rgba(0,167,225,0.2)"/></svg>
  </div>

  <div class="content">
    <p class="statement" id="statement"></p>

    <div class="card">
      <div class="card-name">Chloe Webb</div>
      <div class="card-divider"></div>
      <div class="card-logo">Lannay<span>.com</span></div>
      <div class="card-role">Brand Strategy &amp; Design</div>
    </div>

    <div class="actions">
      <a href="#" class="btn btn-primary">View My Work</a>
      <a href="#" class="btn btn-secondary">Get In Touch</a>
    </div>
  </div>

  <div class="scroll-cue">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
  </div>
</section>
<script>
  const words = [
    { text: '"Ideas', accent: false },
    { text: 'deserve', accent: false },
    { text: '\n', break: true },
    { text: 'better', accent: true },
    { text: 'execution."', accent: false },
  ];
  const el = document.getElementById('statement');
  const BASE_DELAY = 0.15, CHAR_STEP = 0.018;
  let charIndex = 0;
  words.forEach((word, wi) => {
    if (word.break) { el.appendChild(document.createElement('br')); return; }
    if (wi > 0 && !words[wi - 1].break) {
      const sp = document.createElement('span');
      sp.className = 'char space';
      sp.style.animationDelay = `${BASE_DELAY + charIndex * CHAR_STEP}s`;
      sp.innerHTML = '&nbsp;'; el.appendChild(sp); charIndex++;
    }
    const wordWrap = document.createElement('span');
    wordWrap.style.cssText = 'display:inline-block;white-space:nowrap;';
    el.appendChild(wordWrap);
    for (const ch of word.text) {
      const span = document.createElement('span');
      span.className = 'char' + (word.accent ? ' accent' : '');
      span.style.animationDelay = `${BASE_DELAY + charIndex * CHAR_STEP}s`;
      span.textContent = ch; wordWrap.appendChild(span); charIndex++;
    }
  });
</script>
</body>
</html>
